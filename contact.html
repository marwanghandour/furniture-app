<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - My Site</title>
    <meta name="description" content="Contact me through this contact form." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
       <div class="logo">Marwan</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
    </header>


    <main>
      <section>
        <h2>Send a Message</h2>
        <p>
          If you would like to ask a question, please fill out the form below:
        </p>

        <form action="/submit-contact" method="POST">
          <p>
            <label for="full-name">Name:</label><br />
            <input
              type="text"
              id="full-name"
              name="full_name"
              placeholder="Marwan Amir"
              required
            />
          </p>

          <p>
            <label for="user-email">Email:</label><br />
            <input
              type="email"
              id="user-email"
              name="user_email"
              placeholder="marwan@example.com"
              required
            />
          </p>

          <p>
            <label for="user-message">Message:</label><br />
            <textarea
              id="user-message"
              name="user_message"
              rows="5"
              cols="40"
              placeholder="Type your message here..."
              required
            ></textarea>
          </p>

          <p>
            <button type="submit" class="btn">Send Message</button>


          </p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; Marwan</p>
    </footer>
  </body>
</html>
